    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }

        #scrollBar { position: fixed; top: 0; left: 0; height: 4px; background: #1392ec; width: 0; z-index: 40; pointer-events: none; }

        /* Fade In Animation */
        .fade-in { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; will-change: opacity, transform; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        
        /* Lazy Load Animation */
        .lazy-load { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; will-change: opacity, transform; }
        .lazy-load.visible { opacity: 1; transform: translateY(0); }

        /* Stat Boxes with Bounce */
        .stat-box { 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(135deg, rgba(19, 146, 236, 0.1), rgba(19, 146, 236, 0.05));
            border: 1px solid rgba(19, 146, 236, 0.2);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .stat-box:hover::before {
            left: 100%;
        }
        .stat-box:hover { 
            transform: translateY(-12px) scale(1.02); 
            box-shadow: 0 24px 48px rgba(19, 146, 236, 0.2);
            background: linear-gradient(135deg, rgba(19, 146, 236, 0.15), rgba(19, 146, 236, 0.08));
        }

        .stat-number {
            animation: countUp 2s ease-out forwards;
            font-size: 2.5rem;
        }
        
        @keyframes countUp {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Team Card Animations */
        .team-card {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            background: linear-gradient(135deg, rgba(19, 146, 236, 0.05), rgba(19, 146, 236, 0.02));
        }
        .team-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 24px 48px rgba(19, 146, 236, 0.25);
        }
        .team-card img {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            height: auto;
            display: block;
        }
        .team-card:hover img {
            transform: scale(1.15) rotate(2deg);
        }
        .team-card .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1392ec, #1392ec80);
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .team-card:hover .overlay {
            transform: translateY(0);
        }

        /* Value Icons */
        .value-icon {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
        }
        .value-icon:hover {
            transform: scale(1.25) rotate(8deg);
            filter: drop-shadow(0 8px 16px rgba(19, 146, 236, 0.3));
        }

        /* Timeline Animations */
        .timeline-item {
            transition: all 0.3s ease;
            position: relative;
        }
        .timeline-item:hover {
            transform: translateX(12px);
        }
        .timeline-dot {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(19, 146, 236, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(19, 146, 236, 0); }
        }

        /* Parallax Effect for Hero */
        .parallax-bg {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #1392ec, #06a9f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Button Animation */
        .btn-primary {
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            transition: left 0.3s ease;
        }
        .btn-primary:hover::before {
            left: 100%;
        }

        /* Section Divider */
        .section-divider {
            height: 4px;
            background: linear-gradient(90deg, #1392ec, #06a9f5, #1392ec);
            margin: 2rem auto;
            width: 60px;
        }

            }

        }
