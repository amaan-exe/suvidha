<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact Us - Suvidha Travels</title>

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="images/logo.jpg">

    <meta name="description" content="Get in touch with Suvidha Travels. Contact us for queries, bookings, and travel assistance. We're here to help!" />
    <meta name="keywords" content="contact us, travel inquiry, booking, Suvidha Travels, Patna" />
    <meta property="og:title" content="Contact Us - Suvidha Travels" />
    <meta property="og:description" content="Get in touch with Suvidha Travels. Contact us for queries, bookings, and travel assistance." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Oregano&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" as="style">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Oregano&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>

    <script>
        if (window.tailwind) {
            window.tailwind.config.corePlugins = window.tailwind.config.corePlugins || {};
        }
        
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { primary: "#1392ec", "background-light": "#f6f7f8", "background-dark": "#101a22" },
                    fontFamily: { display: ["Plus Jakarta Sans", "sans-serif"], oregano: ["Oregano", "cursive"] }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }

        #scrollBar { position: fixed; top: 0; left: 0; height: 4px; background: #1392ec; width: 0; z-index: 40; pointer-events: none; }

        .fade-in { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; will-change: opacity, transform; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        .lazy-load { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; will-change: opacity, transform; }
        .lazy-load.visible { opacity: 1; transform: translateY(0); }

        .map-container {
            position: relative;
            height: 20rem;
            width: 100%;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1), 0 10px 10px -5px rgb(0 0 0 / 0.04);
        }
        .map-container iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
        @media (min-width: 768px) {
            .map-container {
                height: 24rem;
            }
        }

        input, textarea, select {
            background-color: white;
            border-color: #e5e7eb;
            color: #1f2937;
        }
        .dark input, .dark textarea, .dark select {
            background-color: #1f2937;
            border-color: #4b5563;
            color: #f3f4f6;
        }

        @media (max-width: 640px) {
            .hero h1 { 
                font-size: 2rem !important; 
                line-height: 1.3 !important;
            }
        }
    </style>

</head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 overflow-x-hidden">
    <div id="root"></div>

    <script src="dist/contact-app.js" defer></script>

</body>
</html>
