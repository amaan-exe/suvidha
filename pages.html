<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta id="og-title" property="og:title" content="Destination Tour | Suvidha Travels - Book Your Dream Vacation" />
    <meta id="og-description" property="og:description" content="Discover amazing destinations with Suvidha Travels. Explore our curated tour packages to popular destinations across India and the world. Book your dream vacation today!" />
    <meta id="og-image" property="og:image" content="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200" />
    <meta property="og:url" id="og-url" content="https://suvidhatravels.com/pages.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <meta name="distribution" content="global" />

    <!-- Tailwind + Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Oregano&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" as="style">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Oregano&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" defer></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { 
                        primary: "#1392ec", 
                        "background-light": "#f6f7f8", 
                        "background-dark": "#101a22",
                        "voyage-blue": "#87CEEB",
                        "voyage-orange": "#FFA500",
                        "voyage-sand": "#F5F5DC",
                        "voyage-dark": "#36454F",
                        "voyage-tan": "#D2B48C"
                    },
                    fontFamily: { 
                        display: ["Plus Jakarta Sans", "sans-serif"], 
                        oregano: ["Oregano", "cursive"],
                        sans: ["Poppins", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 }

        /* Animations */
        .fade-in { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; will-change: opacity, transform; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
        .lazy-load { opacity: 0; transform: translateY(20px); transition: all 0.6s ease; will-change: opacity, transform; }
        .lazy-load.visible { opacity: 1; transform: translateY(0); }

        /* Accordion Styles */
        .accordion-summary { cursor: pointer; }
        .accordion-icon { transition: transform 0.2s ease-in-out; }
        .accordion-open .accordion-icon { transform: rotate(90deg); }

        /* Image placeholders */
        img { background: #f0f0f0; }

        /* Scrollbar */
        #scrollBar { position: fixed; top: 0; left: 0; height: 4px; background: #1392ec; width: 0; z-index: 60; transition: width 0.15s linear; }
    </style>

    <!-- JSON-LD Schema Markup for Tour Packages -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAction",
      "name": "Book Your Dream Tour",
      "description": "Browse and book curated tour packages from Suvidha Travels",
      "organizer": {
        "@type": "Organization",
        "@id": "https://suvidhatravels.com/#organization",
        "name": "Suvidha Travels"
      }
    }
    </script>

    <!-- Breadcrumb Schema for Tour Pages -->
    <script type="application/ld+json" id="breadcrumb-schema">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://suvidhatravels.com/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Tour Packages",
          "item": "https://suvidhatravels.com/pages.html"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Destination",
          "item": "https://suvidhatravels.com/pages.html?destination=kashmir"
        }
      ]
    }
    </script>

</head>
<body class="bg-voyage-sand dark:bg-voyage-dark text-voyage-dark dark:text-voyage-sand overflow-x-hidden font-sans">
    <div id="root"></div>

    <!-- Compiled React application from src/pages-app.js via Babel -->
    <script src="dist/pages-app.js" defer></script>

</body>
